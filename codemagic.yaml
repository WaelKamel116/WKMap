# Codemagic cloud build (Flutter project is in app/): builds the iPhone app on a Mac in the cloud and sends it
# to TestFlight. Needs, in Codemagic team settings:
#   - an App Store Connect API key integration named "CairoNav ASC key"
# and in App Store Connect: an app record with bundle id com.smarttechsys.caironav.
# Signing: Team settings > codemagic.yaml settings > Code signing identities must hold an
# Apple Distribution certificate and an App Store profile for that bundle id.
workflows:
  ios-testflight:
    name: iPhone build to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    integrations:
      app_store_connect: CairoNav ASC key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.smarttechsys.caironav
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Unit tests
        script: flutter test
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          # Codemagic's BUILD_NUMBER rises with every build, so TestFlight never sees a duplicate.
          flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testers (App Store Connect users) get every processed build
        # without Apple review. Set to true later for external testers, after filling in
        # TestFlight > Test Information (feedback email, review contact).
        submit_to_testflight: false
